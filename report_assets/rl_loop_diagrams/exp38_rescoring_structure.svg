<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <polygon points="0,0 14,7 0,14" fill="#8b5a2b"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .title { font-size: 46px; font-weight: 800; fill: #c8742c; }
      .sub { font-size: 24px; font-weight: 600; fill: #616b78; }
      .label { font-size: 31px; font-weight: 800; }
      .small { font-size: 22px; font-weight: 600; fill: #566171; }
      .tiny { font-size: 18px; font-weight: 600; fill: #566171; }
      .panel { fill: #fffaf4; stroke: #c86f2a; stroke-width: 5; }
      .box { fill: #fde9cc; stroke: #d47a2d; stroke-width: 4; }
      .model { fill: #ede9ff; stroke: #6b4de6; stroke-width: 4; }
      .score { fill: #e8f6ee; stroke: #2f8a50; stroke-width: 4; }
      .out { fill: #ffe28b; stroke: #d47a2d; stroke-width: 4; }
      .line { stroke: #8b5a2b; stroke-width: 7; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #b68a5a; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .vec { fill: #fff7eb; stroke: #b8702c; stroke-width: 2; }
      .vec2 { fill: #f0ecff; stroke: #6b4de6; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="980" fill="#f6efe6"/>
  <text x="70" y="78" class="title">Exp38 富元数据重排结构示意图</text>
  <text x="70" y="122" class="sub">输入闭环候选框 + metadata，输出重新校准分数后的最终检测结果</text>

  <rect x="55" y="155" width="1690" height="745" rx="32" class="panel"/>

  <!-- Inputs -->
  <rect x="95" y="230" width="280" height="150" rx="24" class="box"/>
  <text x="235" y="287" text-anchor="middle" class="label">C_final</text>
  <text x="235" y="330" text-anchor="middle" class="small">RL 闭环候选框</text>
  <text x="235" y="362" text-anchor="middle" class="tiny">class, box, score</text>

  <rect x="95" y="505" width="280" height="170" rx="24" class="box"/>
  <text x="235" y="560" text-anchor="middle" class="label">Exp38 metadata</text>
  <text x="235" y="603" text-anchor="middle" class="small">box / prompt / class</text>
  <text x="235" y="636" text-anchor="middle" class="small">gdino_score / query_score</text>
  <text x="235" y="668" text-anchor="middle" class="tiny">area, rank, source_type</text>

  <!-- IoU match -->
  <rect x="470" y="350" width="250" height="160" rx="24" class="out"/>
  <text x="595" y="405" text-anchor="middle" class="label">IoU Match</text>
  <text x="595" y="450" text-anchor="middle" class="small">same class</text>
  <text x="595" y="484" text-anchor="middle" class="small">IoU ≥ 0.90</text>

  <line x1="375" y1="305" x2="458" y2="390" class="line"/>
  <line x1="375" y1="590" x2="458" y2="472" class="line"/>

  <!-- Alias branch -->
  <rect x="790" y="205" width="280" height="130" rx="22" class="box"/>
  <text x="930" y="254" text-anchor="middle" class="label">34-d alias feature</text>
  <text x="930" y="294" text-anchor="middle" class="small">score + geometry + class</text>

  <rect x="1140" y="180" width="350" height="180" rx="24" class="model"/>
  <text x="1315" y="232" text-anchor="middle" class="label">AliasReranker</text>
  <text x="1315" y="276" text-anchor="middle" class="small">34 → 96 → 64 → 1</text>
  <text x="1315" y="314" text-anchor="middle" class="small">LayerNorm + ReLU</text>
  <text x="1315" y="346" text-anchor="middle" class="tiny">sigmoid → alias_score</text>

  <line x1="720" y1="400" x2="790" y2="285" class="thin"/>
  <line x1="1070" y1="270" x2="1128" y2="270" class="line"/>

  <!-- Rich feature -->
  <rect x="790" y="445" width="700" height="170" rx="24" class="score"/>
  <text x="1140" y="498" text-anchor="middle" class="label">68-d rich feature</text>
  <text x="1140" y="540" text-anchor="middle" class="small">score(12) + geometry(10) + source(5)</text>
  <text x="1140" y="575" text-anchor="middle" class="small">hierarchy(10) + class one-hot(10+10) + prompt one-hot(11)</text>
  <line x1="720" y1="450" x2="778" y2="520" class="line"/>
  <line x1="1315" y1="360" x2="1315" y2="433" class="line"/>

  <!-- Rich fusion -->
  <rect x="840" y="690" width="420" height="150" rx="24" class="model"/>
  <text x="1050" y="742" text-anchor="middle" class="label">RichFusionModel</text>
  <text x="1050" y="785" text-anchor="middle" class="small">68 → 128 → 80 → 1</text>
  <text x="1050" y="820" text-anchor="middle" class="tiny">LayerNorm + ReLU + Dropout(0.10)</text>
  <line x1="1050" y1="615" x2="1050" y2="678" class="line"/>

  <!-- Final score -->
  <rect x="1350" y="705" width="310" height="120" rx="22" class="out"/>
  <text x="1505" y="754" text-anchor="middle" class="label">final_score</text>
  <text x="1505" y="794" text-anchor="middle" class="small">0.75 · base_blend</text>
  <text x="1505" y="822" text-anchor="middle" class="small">+ 0.25 · fusion_score</text>
  <line x1="1260" y1="765" x2="1338" y2="765" class="line"/>

  <rect x="1390" y="490" width="270" height="85" rx="20" class="box"/>
  <text x="1525" y="525" text-anchor="middle" class="small">base_blend</text>
  <text x="1525" y="558" text-anchor="middle" class="tiny">0.5 metadata + 0.5 alias</text>
  <line x1="1490" y1="338" x2="1520" y2="478" class="thin"/>
  <line x1="1525" y1="575" x2="1525" y2="693" class="thin"/>

  <!-- Output -->
  <rect x="1390" y="250" width="290" height="120" rx="24" class="out"/>
  <text x="1535" y="300" text-anchor="middle" class="label">Predictions</text>
  <text x="1535" y="340" text-anchor="middle" class="small">sort + dedup</text>
  <text x="1535" y="366" text-anchor="middle" class="tiny">class x1 y1 x2 y2 score</text>
  <line x1="1535" y1="705" x2="1535" y2="382" class="thin"/>

  <!-- Feature vector icon -->
  <g transform="translate(820,630)">
    <text x="0" y="0" class="tiny">68-d vector</text>
    <rect x="0" y="18" width="18" height="32" class="vec"/>
    <rect x="23" y="18" width="18" height="32" class="vec"/>
    <rect x="46" y="18" width="18" height="32" class="vec"/>
    <rect x="69" y="18" width="18" height="32" class="vec"/>
    <rect x="92" y="18" width="18" height="32" class="vec"/>
    <text x="122" y="42" class="tiny">...</text>
    <rect x="170" y="18" width="18" height="32" class="vec2"/>
    <rect x="193" y="18" width="18" height="32" class="vec2"/>
    <rect x="216" y="18" width="18" height="32" class="vec2"/>
  </g>

  <text x="88" y="865" class="small">在 38+RL_loop 中：exp38_rescore() 对 C_final 做 metadata 匹配和分数替换；完整重排模型由 AliasReranker + RichFusionModel 组成。</text>
</svg>
