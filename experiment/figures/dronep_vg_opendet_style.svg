  <text x="976" y="335" class="fire">♨</text>
  <text x="1010" y="336" class="label">Small-object aliases</text>
  <text x="976" y="364" class="small">person / pedestrian / cyclist</text>
  <text x="976" y="385" class="small">van / tricycle / small vehicle</text>

  <rect x="950" y="430" width="225" height="90" fill="#f8fafc" class="box"/>
  <text x="976" y="464" class="label">Query matching</text>
  <text x="976" y="493" class="small">query_match_score</text>

  <rect x="950" y="570" width="225" height="75" fill="#ffffff" class="box"/>
