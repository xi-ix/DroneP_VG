  <text x="605" y="296" class="text">transformer</text>
  <text x="605" y="323" class="text">encoder-decoder</text>

  <rect x="835" y="210" width="42" height="230" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <rect x="848" y="232" width="18" height="26" fill="#e5e7eb" stroke="#64748b"/>
  <rect x="848" y="272" width="18" height="26" fill="#e5e7eb" stroke="#64748b"/>
