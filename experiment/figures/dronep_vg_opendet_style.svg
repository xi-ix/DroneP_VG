  <rect x="848" y="352" width="18" height="26" fill="#e5e7eb" stroke="#64748b"/>
  <text x="835" y="466" class="math">Q</text>

  <rect x="475" y="132" width="120" height="42" fill="#a7d98d" stroke="#65a30d"/>
