  <path d="M 242 235 L 352 292" class="arrow"/>
  <path d="M 242 455 C 330 455 310 715 910 715 C 945 715 930 160 950 160" class="dash"/>
  <path d="M 877 325 L 820 455 L 807 455" class="thin"/>
  <path d="M 612 455 L 622 455" class="arrow"/>
  <path d="M 612 536 L 622 536" class="arrow"/>
