  <path d="M 1430 473 L 1480 473" class="arrow"/>
  <path d="M 1545 514 C 1545 548 1510 560 1475 560" class="arrow"/>
  <path d="M 1352 599 C 1250 612 1230 545 1175 585" class="dash"/>

  <rect x="950" y="135" width="225" height="48" fill="#fff7ed" class="box"/>
  <text x="982" y="158" class="label">Prompt Set Builder</text>
  <text x="982" y="176" class="tiny">query + base categories + aliases</text>
  <path d="M 950 160 C 860 158 760 150 712 190" class="dash"/>
  <path d="M 1063 183 L 1063 205" class="thin"/>
  <path d="M 1063 183 C 1063 230 1063 260 1063 305" class="thin"/>

  <text x="1240" y="345" class="math">T_q</text>
  <text x="1212" y="230" class="math">M</text>
  <text x="1615" y="245" class="math">s_f</text>
  <text x="1045" y="416" class="math">VL-prompts</text>
  <text x="682" y="168" class="math">encoder features E</text>

  <line x1="325" y1="380" x2="890" y2="380" stroke="#94a3b8" stroke-width="1.2"/>
