  <text x="405" y="463" class="text">candidate boxes</text>
  <rect x="622" y="427" width="205" height="56" fill="#ffffff" class="box"/>
  <text x="648" y="462" class="fire">♨</text>
  <text x="678" y="462" class="label">Box Prediction</text>

  <rect x="382" y="508" width="230" height="56" fill="#f8fafc" class="box"/>
  <text x="405" y="543" class="text">source scores</text>
  <rect x="622" y="508" width="205" height="56" fill="#ffffff" class="box"/>
  <text x="648" y="543" class="fire">♨</text>
