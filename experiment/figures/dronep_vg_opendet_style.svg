  <path d="M 890 327 L 950 348" class="arrow"/>
  <path d="M 890 370 L 950 476" class="arrow"/>
  <path d="M 1063 393 L 1063 430" class="arrow"/>
  <path d="M 1063 520 L 1063 570" class="arrow"/>

