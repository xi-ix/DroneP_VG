  <rect x="50" y="78" width="245" height="605" fill="#f8fafc" class="panel"/>
  <text x="76" y="112" class="sec">Open-Vocabulary</text>
  <text x="76" y="136" class="sec">UAV Grounding</text>

  <rect x="82" y="170" width="160" height="130" fill="url(#imgGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="98" y="194" width="68" height="50" fill="#e0f2fe" stroke="#334155" stroke-width="1.2"/>
  <rect x="156" y="238" width="54" height="34" fill="#dcfce7" stroke="#334155" stroke-width="1.2"/>
  <circle cx="177" cy="219" r="10" fill="#ef4444" opacity="0.85"/>
  <circle cx="121" cy="262" r="7" fill="#f97316" opacity="0.9"/>
