  <text x="1315" y="466" class="label">Class-aware</text>
  <text x="1325" y="492" class="label">NMS</text>

  <rect x="1480" y="432" width="130" height="82" fill="#eff6ff" class="box"/>
  <text x="1515" y="466" class="label">TopK</text>
  <text x="1505" y="492" class="small">per class</text>

