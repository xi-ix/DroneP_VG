<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760">
  <defs>
    <style>
      .title { font: 700 24px "Times New Roman", "Noto Serif CJK SC", serif; fill: #111827; }
      .sec { font: 700 20px "Times New Roman", "Noto Serif CJK SC", serif; fill: #111827; }
      .label { font: 700 18px Arial, "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .text { font: 400 16px Arial, "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .small { font: 400 13px Arial, "Noto Sans CJK SC", sans-serif; fill: #374151; }
      .tiny { font: 400 12px Arial, "Noto Sans CJK SC", sans-serif; fill: #4b5563; }
      .math { font: italic 17px "Times New Roman", serif; fill: #111827; }
      .panel { stroke: #64748b; stroke-width: 1.8; }
      .box { rx: 8; ry: 8; stroke: #334155; stroke-width: 1.8; }
      .mini { rx: 4; ry: 4; stroke: #475569; stroke-width: 1.4; }
      .arrow { fill: none; stroke: #111827; stroke-width: 2.3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #4b5563; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrowSmall); }
      .thin { fill: none; stroke: #4b5563; stroke-width: 1.5; marker-end: url(#arrowSmall); }
      .loss { font: 700 15px "Times New Roman", "Noto Serif CJK SC", serif; fill: #b91c1c; }
      .fire { font: 22px Arial, sans-serif; fill: #f97316; }
      .snow { font: 22px Arial, sans-serif; fill: #0284c7; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <linearGradient id="imgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.45" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1700" height="760" fill="#ffffff"/>
