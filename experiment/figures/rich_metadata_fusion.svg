<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760">
  <defs>
    <style>
      .title { font: 700 24px "Times New Roman", "Noto Serif CJK SC", serif; fill: #111827; }
      .sec { font: 700 20px "Times New Roman", "Noto Serif CJK SC", serif; fill: #111827; }
      .label { font: 700 18px Arial, "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .text { font: 400 16px Arial, "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .small { font: 400 13px Arial, "Noto Sans CJK SC", sans-serif; fill: #374151; }
      .tiny { font: 400 12px Arial, "Noto Sans CJK SC", sans-serif; fill: #4b5563; }
      .math { font: italic 17px "Times New Roman", serif; fill: #111827; }
      .panel { stroke: #64748b; stroke-width: 1.8; }
      .box { rx: 8; ry: 8; stroke: #334155; stroke-width: 1.8; }
      .mini { rx: 6; ry: 6; stroke-width: 1.6; }
      .arrow { fill: none; stroke: #111827; stroke-width: 2.3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #4b5563; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrowSmall); }
      .thin { fill: none; stroke: #4b5563; stroke-width: 1.5; marker-end: url(#arrowSmall); }
      .fire { font: 22px Arial, sans-serif; fill: #f97316; }
      .note { font: 700 15px "Times New Roman", "Noto Serif CJK SC", serif; fill: #b91c1c; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1700" height="760" fill="#ffffff"/>
  <text x="850" y="38" text-anchor="middle" class="title">Rich Metadata Fusion for Small-Object Visual Grounding</text>
  <line x1="46" y1="52" x2="1654" y2="52" stroke="#111827" stroke-width="2"/>

  <rect x="50" y="78" width="310" height="605" fill="#f8fafc" class="panel"/>
  <text x="76" y="112" class="sec">① Candidate Records</text>
  <text x="76" y="140" class="text">GroundingDINO outputs</text>
  <text x="76" y="165" class="text">+ prompt / query context</text>

  <rect x="82" y="220" width="225" height="72" fill="#eff6ff" class="box"/>
  <text x="108" y="250" class="label">candidate box</text>
  <text x="108" y="276" class="small">class / xyxy / raw score</text>

  <rect x="82" y="340" width="225" height="72" fill="#fff7ed" class="box"/>
  <text x="108" y="370" class="label">source prompt</text>
  <text x="108" y="396" class="small">base class or alias phrase</text>

  <rect x="82" y="460" width="225" height="72" fill="#f0fdf4" class="box"/>
  <text x="108" y="490" class="label">query context</text>
  <text x="108" y="516" class="small">text query Q and class prior</text>

  <rect x="395" y="78" width="360" height="605" fill="#eaf3ff" opacity="0.92" class="panel"/>
  <text x="420" y="112" class="sec">② Metadata Feature Groups</text>

  <rect x="430" y="150" width="285" height="76" fill="#ecfdf5" stroke="#10b981" class="mini"/>
  <text x="462" y="181" class="label">Score features</text>
  <text x="462" y="207" class="small">gdino / query_match / alias score</text>

  <rect x="430" y="265" width="285" height="76" fill="#fff7ed" stroke="#f59e0b" class="mini"/>
  <text x="462" y="296" class="label">Source features</text>
  <text x="462" y="322" class="small">source_type / prompt / class id</text>

  <rect x="430" y="380" width="285" height="76" fill="#eff6ff" stroke="#2563eb" class="mini"/>
  <text x="462" y="411" class="label">Geometry features</text>
  <text x="462" y="437" class="small">area ratio / box size / rank</text>

  <rect x="430" y="495" width="285" height="96" fill="#fef2f2" stroke="#ef4444" class="mini"/>
  <text x="462" y="526" class="label">Small-object prior</text>
  <text x="462" y="552" class="small">small area bonus</text>
  <text x="462" y="575" class="small">alias hierarchy features</text>

  <rect x="800" y="78" width="355" height="605" fill="#fff7ed" opacity="0.95" class="panel"/>
  <text x="825" y="112" class="sec">③ Fusion Calibrator</text>

  <rect x="850" y="155" width="255" height="290" fill="#ede9fe" class="box"/>
  <text x="902" y="207" class="fire">♨</text>
  <text x="936" y="208" class="label">Unified Fusion Head</text>
  <text x="885" y="255" class="text">feature normalization</text>
  <text x="885" y="292" class="text">weighted binary supervision</text>
  <text x="885" y="329" class="text">small-class reweighting</text>
  <text x="885" y="366" class="text">hard negative awareness</text>
  <text x="885" y="403" class="text">calibrated final score</text>

  <rect x="850" y="505" width="255" height="82" fill="#ffffff" class="box"/>
  <text x="884" y="538" class="label">Training signal</text>
  <text x="884" y="565" class="small">IoU >= 0.5 positive labels</text>

  <text x="820" y="650" class="note">Goal: rank reliable small-object boxes higher</text>

  <rect x="1200" y="78" width="450" height="260" fill="#f5f3ff" class="panel"/>
  <text x="1225" y="112" class="sec">④ Fused Confidence</text>

  <rect x="1245" y="155" width="160" height="110" fill="#ffffff" class="box"/>
  <text x="1282" y="198" class="label">Metadata</text>
  <text x="1274" y="225" class="small">M</text>

  <rect x="1460" y="155" width="145" height="110" fill="#dcfce7" class="box"/>
  <text x="1495" y="198" class="label">final</text>
  <text x="1488" y="225" class="label">score</text>
  <text x="1512" y="250" class="math">s_f</text>

  <rect x="1200" y="380" width="450" height="303" fill="#f0fdf4" class="panel"/>
  <text x="1225" y="414" class="sec">⑤ Post-processing &amp; Output</text>

  <rect x="1240" y="455" width="155" height="82" fill="#eff6ff" class="box"/>
  <text x="1266" y="489" class="label">Class-aware</text>
  <text x="1284" y="515" class="label">NMS</text>

  <rect x="1445" y="455" width="145" height="82" fill="#eff6ff" class="box"/>
  <text x="1482" y="489" class="label">TopK</text>
  <text x="1468" y="515" class="small">per class</text>

  <rect x="1320" y="585" width="200" height="74" fill="#dcfce7" class="box"/>
  <text x="1360" y="616" class="label">Final boxes</text>
  <text x="1352" y="640" class="small">class / box / score</text>

  <path d="M 307 256 C 348 256 378 188 430 188" class="arrow"/>
  <path d="M 307 376 C 355 376 378 303 430 303" class="arrow"/>
  <path d="M 307 496 C 358 496 380 418 430 418" class="arrow"/>

  <path d="M 715 188 C 765 188 788 235 850 255" class="arrow"/>
  <path d="M 715 303 C 765 303 788 300 850 300" class="arrow"/>
  <path d="M 715 418 C 765 418 788 365 850 365" class="arrow"/>
  <path d="M 715 543 C 765 543 790 410 850 410" class="arrow"/>

  <path d="M 978 505 L 978 445" class="thin"/>
  <path d="M 1105 300 C 1160 300 1190 210 1245 210" class="arrow"/>
  <path d="M 1405 210 L 1460 210" class="arrow"/>

  <path d="M 1532 265 C 1532 350 1320 370 1320 455" class="arrow"/>
  <path d="M 1395 496 L 1445 496" class="arrow"/>
  <path d="M 1518 537 C 1518 565 1485 585 1455 585" class="arrow"/>

  <path d="M 1605 620 C 1630 690 1210 710 1070 590" class="dash"/>
  <text x="1260" y="720" class="small">The gain comes from metadata-aware ranking, not from adding extra boxes.</text>
  <text x="1260" y="742" class="small">Prediction count stays 52872; mAP@0.5 improves to 0.1690.</text>
</svg>
